name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: ["52", "60"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tox
        run: pip install tox

      - name: Run tests (Django ${{ matrix.django }})
        run: tox -e django${{ matrix.django }}

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Django ${{ matrix.django }} test results
          path: test-report.xml
          reporter: python-xunit
